<div class="forecast-view">
  <div class="forecast-container">
    <div *ngFor="let day of $forecast()?.forecast?.forecastday" class="forecast-day">
      <div class="date">
        {{ day?.date | date:'EEE, MMM d' }}
      </div>
      <div class="temperatures">
        <span class="min">{{ day.day.mintemp_f }}°F</span>
        <span class="max">{{ day.day.maxtemp_f }}°F</span>
      </div>
      <div class="weather-icon">
        <img [src]="day.day.condition.icon" [alt]="day.day.condition.text">
      </div>
      <div class="condition">{{ day.day.condition.text }}</div>
      <div class="details">
        <div class="detail-item">
          <i class="fas fa-tint"></i>
          <span>{{ day.day.avghumidity }}%</span>
        </div>
        <div class="detail-item">
          <i class="fas fa-wind"></i>
          <span>{{ day.day.maxwind_mph }} mph</span>
        </div>
        <div class="detail-item">
          <i class="fas fa-cloud-rain"></i>
          <span>{{ day.day.daily_chance_of_rain }}%</span>
        </div>
      </div>
    </div>
  </div>
</div>
